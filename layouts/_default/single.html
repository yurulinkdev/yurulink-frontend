{{ define "main" }}
<article class="mx-auto max-w-3xl px-4 py-8 sm:px-7">
  <nav class="mb-5 text-sm text-muted-ink" aria-label="パンくずリスト">
    <a href="{{ "" | relURL }}" class="hover:underline">ホーム</a>
    {{ with .CurrentSection }} / <a href="{{ .RelPermalink }}" class="hover:underline">{{ .Title }}</a>{{ end }}
  </nav>
  <header class="mb-8 border-b border-line pb-5">
    <h1 class="text-2xl font-bold leading-relaxed sm:text-3xl">{{ .Title }}</h1>
    <time class="mt-3 block text-sm text-muted-ink" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
    {{ with .Description }}<p class="mt-3 text-muted-ink">{{ . }}</p>{{ end }}
  </header>
  <div class="article-prose">{{ .Content }}</div>
</article>
{{ end }}
