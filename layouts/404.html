{{ define "main" }}
<section class="mx-auto max-w-3xl px-4 py-16 text-center" aria-labelledby="not-found-heading">
  <p class="mb-4 text-sm font-semibold text-accent">404 / Not Found</p>
  <h1 id="not-found-heading" class="text-2xl font-bold sm:text-3xl">{{ i18n "notFound" }}</h1>
  <p class="mt-4 text-muted-ink">{{ i18n "notFoundText" }}</p>
  <a href="{{ "" | relURL }}" class="mt-6 inline-block rounded-lg border border-line bg-panel px-5 py-3 text-accent hover:bg-panel-muted focus-visible:outline">{{ i18n "notFoundHome" }}</a>
</section>
{{ end }}
