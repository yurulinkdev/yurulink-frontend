<header class="sticky top-0 z-20 border-b border-line bg-panel/95 px-4 py-3 backdrop-blur sm:px-7">
  <div class="flex items-center gap-3">
    <button id="open-categories" type="button" aria-controls="category-drawer" aria-expanded="false" class="rounded-lg border border-line px-3 py-2 lg:hidden">☰ <span class="sr-only">メニューを開く</span></button>
    {{ if .IsHome }}
      <label class="relative min-w-0 flex-1">
        <span class="sr-only">コンテンツを検索</span>
        <input id="query" type="search" placeholder="タイトル・説明・番組名で検索" class="w-full rounded-xl border border-line bg-page px-4 py-2.5 text-ink placeholder:text-muted-ink" autocomplete="off">
      </label>
    {{ else }}
      <a class="min-w-0 flex-1 truncate font-semibold text-accent hover:underline" href="{{ "" | relURL }}">YuruLink</a>
    {{ end }}
    <label class="flex items-center gap-2">
      <span class="sr-only">表示テーマ</span>
      <select id="theme-select" aria-label="表示テーマ" class="rounded-lg border border-line bg-panel px-2 py-2.5 text-sm text-ink">
        <option value="auto">自動</option><option value="light">ライト</option><option value="dark">ダーク</option>
      </select>
    </label>
  </div>
</header>
