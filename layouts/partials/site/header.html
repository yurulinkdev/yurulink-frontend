<header class="relative z-20 border-b border-line bg-panel/95 px-4 py-3 backdrop-blur sm:px-7 lg:sticky lg:top-0">
  <div class="flex flex-wrap items-center gap-3">
    <button id="open-categories" type="button" aria-controls="category-drawer" aria-expanded="false" class="rounded-lg border border-line px-3 py-2 lg:hidden">☰ <span class="sr-only">メニューを開く</span></button>
    <a class="inline-flex min-w-0 items-center gap-2 text-lg font-bold tracking-tight text-accent lg:hidden" href="{{ "" | relURL }}" aria-label="YuruLink トップページ">
      <img src="{{ .Site.Params.brand_logo | default "brand/yurulink-symbol-approved-transparent.png" | relURL }}" alt="" width="36" height="36" class="h-9 w-9 shrink-0 object-contain" decoding="async">
      <span class="brand-wordmark">YuruLink</span>
    </a>
    {{ if .IsHome }}
      <label class="relative order-3 w-full min-w-0 lg:order-none lg:flex-1">
        <span class="sr-only">コンテンツを検索</span>
        <input id="query" type="search" placeholder="タイトル・説明・番組名で検索" class="w-full rounded-xl border border-line bg-page px-4 py-2.5 text-ink placeholder:text-muted-ink" autocomplete="off">
      </label>
    {{ else }}
      <a class="min-w-0 flex-1 truncate font-semibold text-accent hover:underline" href="{{ "" | relURL }}">YuruLink</a>
    {{ end }}
    <div role="group" aria-label="表示テーマ" class="ml-auto inline-flex items-center gap-1 lg:ml-0"><button id="theme-toggle" type="button" class="inline-flex h-10 w-10 items-center justify-center rounded-lg border border-line bg-panel text-ink" aria-label="テーマを切り替え" title="テーマを切り替え"><span id="theme-icon" aria-hidden="true">◐</span></button><button id="theme-auto" type="button" class="inline-flex h-10 w-10 items-center justify-center rounded-lg border border-line bg-panel text-ink" aria-label="OSのテーマ設定に追従" title="OSのテーマ設定に追従"><svg aria-hidden="true" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></svg></button></div>
  </div>
</header>
