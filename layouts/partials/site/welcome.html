{{/* 長文はcontent/welcome/_index.md。短い操作文言はi18n。 */}}
{{ with .Site.GetPage "/welcome" }}
<section class="mx-auto flex min-h-[65vh] max-w-4xl flex-col px-4 py-10 sm:px-7" aria-labelledby="welcome-heading">
  <div class="rounded-xl border border-line bg-panel px-6 py-8 sm:px-9 sm:py-10">
    {{ with .Params.kicker }}<p class="mb-3 text-xs font-semibold tracking-wide text-muted-ink">{{ . }}</p>{{ end }}
    <h1 id="welcome-heading" class="text-2xl font-bold text-ink sm:text-3xl">{{ $.Site.Title }}{{ i18n "welcomeSuffix" }}</h1>
    <div class="article-prose mt-5 max-w-2xl text-base leading-8 text-muted-ink">{{ .Content }}</div>
  </div>
  {{ if partial "site/catalog-available.html" $ }}
    <div class="mt-auto pt-10 text-center">
      <a id="welcome-catalog-link" class="inline-flex min-h-12 items-center justify-center rounded-xl bg-accent px-8 py-3 font-semibold text-white hover:opacity-90 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent" href="{{ "catalog/" | relURL }}" data-reset-category>{{ i18n "allContents" }}</a>
    </div>
  {{ end }}
</section>
{{ end }}
