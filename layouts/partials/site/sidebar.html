<div id="drawer-backdrop" class="fixed inset-0 z-30 hidden bg-black/40 lg:hidden" aria-hidden="true"></div>
<aside id="category-drawer" aria-label="サイトナビゲーション" class="fixed inset-y-0 left-0 z-40 w-72 -translate-x-full overflow-y-auto border-r border-line bg-panel p-5 shadow-xl transition-transform lg:sticky lg:top-0 lg:h-screen lg:w-auto lg:translate-x-0 lg:shadow-none">
  <div class="mb-7 flex items-center justify-between">
    <a href="{{ "" | relURL }}" class="inline-flex items-center gap-2 text-xl font-bold tracking-tight text-accent"><img src="{{ .Site.Params.brand_logo | default "brand/yurulink-symbol-approved-transparent.png" | relURL }}" alt="" width="40" height="40" class="h-10 w-10 shrink-0 object-contain" decoding="async"><span class="brand-wordmark">YuruLink</span></a>
    <button id="close-categories" type="button" class="inline-flex h-11 w-11 shrink-0 items-center justify-center rounded-lg border border-line text-ink transition-colors hover:bg-panel-muted lg:hidden" aria-label="カテゴリメニューを閉じる" title="カテゴリメニューを閉じる">
      {{/* Heroicons v2 / arrow-left (24px outline)。左ドロワーが画面外へ戻る操作を示す。 */}}
      <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="h-6 w-6"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"/></svg>
    </button>
  </div>
  <nav aria-label="サイト内ページ" class="mb-6 space-y-2 text-sm">
    <a class="block rounded-lg px-3 py-2 hover:bg-panel-muted" href="{{ "" | relURL }}">リンク集</a>
    <a class="block rounded-lg px-3 py-2 hover:bg-panel-muted" href="{{ "posts/" | relURL }}">記事</a>
    <a class="block rounded-lg px-3 py-2 hover:bg-panel-muted" href="{{ "news/" | relURL }}">お知らせ</a>
  </nav>
  {{ if .IsHome }}
    <p class="mb-3 text-xs font-semibold tracking-wide text-muted-ink">カテゴリー・番組</p>
    <nav id="category-buttons" class="space-y-1" aria-label="番組一覧"></nav>
    {{ with .Site.Params.sidebar_notice }}<p class="mt-6 text-xs leading-relaxed text-muted-ink">{{ . }}</p>{{ end }}
  {{ end }}
</aside>
