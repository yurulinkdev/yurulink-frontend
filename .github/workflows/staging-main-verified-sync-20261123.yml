name: Build staging main candidate with protected production configuration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/staging-main-verified-sync-20261123.yml'
permissions:
  contents: write
concurrency:
  group: staging-main-verified-sync-20261123
  cancel-in-progress: false
jobs:
  prepare-validated-merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Publish run ID to dedicated status branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,datetime,json,os,urllib.request
          content=json.dumps({'state':'started','github_run_id':os.getenv('GITHUB_RUN_ID'),'at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()})
          req=urllib.request.Request(
              'https://api.github.com/repos/yurulinkdev/yurulink-frontend/contents/ops/reports/staging-main-validation-20261123.json',
              method='PUT',
              headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],
                       'Accept':'application/vnd.github+json','Content-Type':'application/json',
                       'User-Agent':'YuruLink-staging-merge'},
              data=json.dumps({'message':'ops: mark staging integration CI started',
                               'branch':'ops/staging-main-sync-status-20261123',
                               'content':base64.b64encode(content.encode()).decode()}).encode())
          with urllib.request.urlopen(req,timeout=20) as response: print('VALIDATION_STATUS_STARTED',response.status)
          PY
      - name: Prepare isolated true merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test "$(git branch --show-current)" = "main"
          git fetch origin staging main
          git switch -c integration/staging-main-ready-20261123
          if GIT_MERGE_AUTOEDIT=no git merge --no-ff --no-commit origin/staging; then
            echo 'Clean git merge'
          else
            unresolved="$(git diff --name-only --diff-filter=U)"
            expected="$(printf 'README.md\ndocs/environments.md')"
            if [ "$unresolved" != "$expected" ]; then
              echo "::error::Unexpected conflicts: $unresolved"
              exit 1
            fi
            git checkout --theirs README.md
            git checkout --ours docs/environments.md
            git add README.md docs/environments.md
          fi
          python3 - <<'PY'
          from pathlib import Path
          readme=Path('README.md').read_text()
          assert '## Hugoコンテンツと共通UI' in readme
          assert '定期ジョブによる' in readme
          doc=Path('docs/environments.md')
          content=doc.read_text()
          mark='\u0060staging\u0060から\u0060main\u0060へのマージはコード変更だけでなくPages Productionの自動デプロイを伴い得る操作です。事前承認なしに実施しません。BackendのBlue／Green有効世代、初回データ公開、DNS切替も独立した承認対象です。'
          assert mark in content
          if '定期データ更新の例外' not in content:
              content=content.replace(mark,mark+'\n\n**定期データ更新の例外**：Backendが検証済み\u0060catalog.json\u0060を\u0060data/public/catalog.json\u0060に配信する定期ジョブは、Frontendの\u0060staging\u0060と\u0060main\u0060の双方へ自動反映してよい。JSON更新に伴うProductionビルドはコード変更の昇格とは区別し、コード・設定変更を混在させない。',1)
          assert '### Cloudflare旧独立Staging削除' in content
          assert '### Custom Domain切替の実施' in content
          doc.write_text(content)
          PY
          git add docs/environments.md
          if git diff --cached --name-only | grep -qx 'data/public/catalog.json'; then
            echo "Preserving main's latest auto-published catalog"
            git checkout origin/main -- data/public/catalog.json
          fi
          git rm .github/workflows/staging-main-verified-sync-20261123.yml
          test -z "$(git diff --name-only --diff-filter=U)"
          test "$(git show :scripts/prepare-site-build.mjs | grep -c 'https://www.yurulink.com/')" -ge 1
          test "$(git show :scripts/prepare-site-build.mjs | grep -c 'https://staging.yurulink.com/')" -ge 1
          git diff --cached --stat | tail -55
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.152.2'
          extended: true
      - name: Validate Hugo build, smoke, GA4 host and SEO gates for both environments
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          bash scripts/smoke-test.sh
          node scripts/verify-site-environments.mjs
      - name: Publish verified candidate on separate integration branch only
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "Merge staging UI and content into main; preserve production Cloudflare and catalog rules"
          git push origin HEAD:refs/heads/integration/staging-main-ready-20261123
          echo "VALIDATED_MERGE_SHA=$(git rev-parse HEAD)"
