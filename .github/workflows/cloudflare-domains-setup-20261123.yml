name: YuruLink Cloudflare custom domain cutover (fixed scope)
run-name: Cloudflare custom domains at ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cloudflare-domains-setup-20261123.yml
      - ops/requests/cloudflare-domains-20261123.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yl-cloudflare-domain-cutover
  cancel-in-progress: false

jobs:
  configure:
    # This workflow always operates on exactly www.yurulink.com and
    # staging.yurulink.com. Mode is plan until explicitly changed to apply.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES_WRITE_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_WRITE_TOKEN }}
      CLOUDFLARE_DNS_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_API_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Python and run fixed-scope plan/apply
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ops/cloudflare-custom-domains-20261123.py
          python3 scripts/ops/cloudflare-custom-domains-20261123.py
