name: Verify Cloudflare Pages preview deployment

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character SHA to verify (default current branch HEAD)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-preview-verification
  cancel-in-progress: true

jobs:
  verify-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_SHA: ${{ inputs.commit_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Verify required configuration
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Wait for exact staging commit to deploy as Preview
        run: |
          python3 scripts/wait-cloudflare-pages.py \
            --project yurulink-frontend \
            --branch staging \
            --environment preview \
            --sha "$TARGET_SHA" \
            --timeout 600 \
            --interval 15
