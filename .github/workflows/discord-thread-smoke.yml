name: Discord forum thread one-time smoke test
on:
  push:
    branches: [feat/discord-routing-threads-20261120]
    paths:
      - '.github/workflows/discord-thread-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate thread routing before sending
        run: node ops/notifications/validate-routes.js
      - name: Send six explicitly labeled test messages (no mentions)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node ops/notifications/smoke-test-discord.js
