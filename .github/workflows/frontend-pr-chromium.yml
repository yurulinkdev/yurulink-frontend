name: Frontend PR Chromium E2E (local build)

on:
  pull_request:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-pr-chromium-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.152.2'
          extended: true
      - name: Build static Hugo site
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Start local read-only static server
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/serve-hugo-for-e2e.py > /tmp/yurulink-pr-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/yurulink-pr-http.log
          exit 1
      - name: Install Chromium
        run: |
          npm install --no-save --no-audit --no-fund @playwright/test
          npx playwright install --with-deps chromium
      - name: Full browser regression on exact pull request build
        env:
          STAGING_URL: http://127.0.0.1:4173/
        run: npx playwright test --config=playwright.config.mjs
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-browser-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 7
