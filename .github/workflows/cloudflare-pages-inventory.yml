name: Cloudflare Pages inventory (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check required configuration
        shell: bash
        env:
          CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_PAGES_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing variable CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Inspect Pages project configuration via read-only API
        shell: bash
        env:
          CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p inventory
          curl --fail --silent --show-error --retry 2 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects?per_page=100" \
            > inventory/projects-response.json
          jq -e '.success == true' inventory/projects-response.json >/dev/null
          jq '[.result[] | {
            name, subdomain, production_branch,
            source_type: .source.type,
            source_repo: .source.config.repo_name,
            build_command: .build_config.build_command,
            destination_dir: .build_config.destination_dir,
            domains
          }]' inventory/projects-response.json > inventory/projects-summary.json
          jq . inventory/projects-summary.json
          rm inventory/projects-response.json
      - name: Upload sanitized inventory
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-inventory
          path: inventory/projects-summary.json
          if-no-files-found: error
          retention-days: 7
