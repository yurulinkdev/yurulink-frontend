name: YuruLink apex redirect - public verification
on:
  push:
    branches: [ops/apex-redirect-20261124]
    paths: ['.github/workflows/apex-redirect-20261124.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify DNS and exact redirect without credentials
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess, time, urllib.request, urllib.error
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          opener=urllib.request.build_opener(NoRedirect())
          cases=[("https://yurulink.com/","https://www.yurulink.com/"),("http://yurulink.com/","https://www.yurulink.com/"),("https://yurulink.com/catalog/?apex_probe=1","https://www.yurulink.com/catalog/?apex_probe=1"),("http://yurulink.com/catalog/?apex_probe=1","https://www.yurulink.com/catalog/?apex_probe=1")]
          def probe(url):
              req=urllib.request.Request(url,method="GET",headers={"User-Agent":"YuruLinkApexVerify/1"})
              try:
                  with opener.open(req,timeout=8) as r:
                      return r.status,r.headers.get("Location")
              except urllib.error.HTTPError as e:
                  return e.code,e.headers.get("Location")
              except Exception as e:
                  return None,type(e).__name__+": "+str(e)
          for attempt in range(6):
              print("ATTEMPT",attempt+1,flush=True)
              subprocess.run(["dig","+time=2","+tries=1","+short","A","yurulink.com","@1.1.1.1"],check=False)
              results=[(u,expected,probe(u)) for u,expected in cases]
              for u,expected,actual in results:
                  print(u,actual,flush=True)
              controls=[(u,probe(u)) for u in ["https://www.yurulink.com/","https://staging.yurulink.com/"]]
              print("CONTROLS",controls,flush=True)
              if all(actual==(301,expected) for u,expected,actual in results) and all(a[0]==200 for u,a in controls):
                  print("PUBLIC_REDIRECT_VERIFIED",flush=True)
                  break
              if attempt==5:
                  raise SystemExit("Public redirect not yet fully verified")
              time.sleep(10)
          PY
