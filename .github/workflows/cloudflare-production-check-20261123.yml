name: Read-only Cloudflare Pages production deployment verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-production-check-20261123.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Query Pages deploy history and save sanitized result
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,json,os,urllib.error,urllib.parse,urllib.request,datetime
          account=os.environ.get('CLOUDFLARE_ACCOUNT_ID','')
          token=os.environ.get('CLOUDFLARE_API_TOKEN','')
          if len(account)!=32 or not token: raise SystemExit('Cloudflare account/token unavailable')
          url='https://api.cloudflare.com/client/v4/accounts/'+account+'/pages/projects/yurulink-frontend/deployments?per_page=25'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'User-Agent':'YuruLink-Pages-Release-Audit/1'})
          with urllib.request.urlopen(req,timeout=25) as response: data=json.load(response)
          if not data.get('success'): raise SystemExit('Cloudflare Pages deployment API rejected request')
          records=[]
          for d in data.get('result',[]):
            metadata=(d.get('deployment_trigger') or {}).get('metadata') or {}
            records.append({
              'environment':d.get('environment'),
              'branch':metadata.get('branch'),
              'commit_hash':metadata.get('commit_hash'),
              'created_on':d.get('created_on'),
              'deployment_url':d.get('url'),
              'stages':[{'name':s.get('name'),'status':s.get('status')} for s in d.get('stages',[])],
            })
          selected={}
          for d in records:
            key='production' if d['environment']=='production' else 'staging' if d['branch']=='staging' else None
            if key and key not in selected: selected[key]=d
          result={'at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  'github_run_id':os.environ.get('GITHUB_RUN_ID'),
                  'latest':selected,'latest_ten':records[:10]}
          print(json.dumps(result,ensure_ascii=False,indent=2))
          branch='ops/staging-main-sync-status-20261123'
          filepath='ops/reports/prod-pages-deploy-20261123.json'
          path='https://api.github.com/repos/yurulinkdev/yurulink-frontend/contents/'+filepath
          headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'YuruLink-Pages-Release-Audit/1'}
          sha=None
          try:
            get=urllib.request.Request(path+'?ref='+urllib.parse.quote(branch,safe=''),headers=headers)
            with urllib.request.urlopen(get,timeout=15) as r: sha=json.load(r).get('sha')
          except urllib.error.HTTPError as e:
            if e.code!=404: raise
          body={'message':'ops: record current Cloudflare Pages deployment SHA and stage',
                'branch':branch,
                'content':base64.b64encode((json.dumps(result,ensure_ascii=False,indent=2)+'\n').encode()).decode()}
          if sha: body['sha']=sha
          put=urllib.request.Request(path,data=json.dumps(body).encode(),method='PUT',headers={**headers,'Content-Type':'application/json'})
          with urllib.request.urlopen(put,timeout=20) as r: print('DEPLOYMENT_AUDIT_WRITTEN',r.status)
          PY
