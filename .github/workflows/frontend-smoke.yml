name: Frontend smoke test

on:
  push:
    branches: [main, staging, feat/catalog-v2-taxonomy-ui]
    paths-ignore:
      - 'ops/requests/frontend-validation.json'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 連続pushで過去SHAのHugoビルドを重ねず、最新ブランチを優先する。
concurrency:
  group: frontend-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.152.2'
          extended: true
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Build and smoke test
        run: bash scripts/smoke-test.sh
      - name: Verify Cloudflare Preview and Production builds
        run: node scripts/verify-site-environments.mjs
