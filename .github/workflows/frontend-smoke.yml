name: Frontend smoke test

on:
  push:
    branches: [main, staging, feat/catalog-v2-taxonomy-ui, feat/brand-staging-preview-20261119]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.152.2'
          extended: true
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Build and smoke test
        run: bash scripts/smoke-test.sh
      - name: Validate brand asset integration
        run: |
          test -s public/brand/yurulink-symbol-tight.svg
          grep -q 'brand/yurulink-symbol-tight.svg' public/index.html
          grep -Eq 'rel=("icon"|icon)([ >])' public/index.html
