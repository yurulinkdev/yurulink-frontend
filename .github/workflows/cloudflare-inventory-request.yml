name: Cloudflare inventory request (read only)

on:
  push:
    branches: [main]
    paths:
      - ops/requests/cloudflare-inventory.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-inventory-request
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate inventory request
        shell: bash
        run: |
          set -euo pipefail
          file=ops/requests/cloudflare-inventory.json
          jq -e '
            type == "object" and
            (keys | sort) == ["action","request_id","schema_version"] and
            .schema_version == 1 and
            .action == "inventory_pages_readonly" and
            (.request_id | type == "string" and test("^[a-zA-Z0-9_-]{1,64}$"))
          ' "$file" >/dev/null
          echo "Validated read-only inventory request"
      - name: Check Cloudflare configuration
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing variable CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler
        run: npm install --no-save --no-audit --no-fund wrangler@4
      - name: List Pages projects with Wrangler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inventory
          npx wrangler pages project list | tee inventory/projects-summary.txt
      - name: Diagnose Pages REST endpoints (read only)
        id: rest_inventory
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for endpoint in \
            "accounts/$CLOUDFLARE_ACCOUNT_ID" \
            "accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
            "accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/yurulink-frontend"; do
            case "$endpoint" in
              */pages/projects) name="projects-list";;
              */pages/projects/yurulink-frontend) name="production-project";;
              *) name="account";;
            esac
            status=$(curl --silent --show-error --retry 2 -o inventory/api-response.json -w '%{http_code}' \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/$endpoint")
            if [ "$status" != 200 ] || ! jq -e '.success == true' inventory/api-response.json >/dev/null; then
              codes=$(jq -r '[.errors[]? | .code] | map(tostring) | join(",")' inventory/api-response.json 2>/dev/null || true)
              echo "::warning::$name: HTTP $status, error codes: $codes"
              continue
            fi
            echo "$name: HTTP 200"
            if [ "$name" = "projects-list" ]; then
              jq '[.result[] | {
                name, subdomain, production_branch,
                source_type: .source.type,
                source_repo: .source.config.repo_name,
                source_branch: .source.config.production_branch,
                build_command: .build_config.build_command,
                destination_dir: .build_config.destination_dir,
                domains
              }]' inventory/api-response.json > inventory/projects-details.json
              ok=1
            elif [ "$name" = "production-project" ]; then
              jq '{name: .result.name, subdomain: .result.subdomain,
                production_branch: .result.production_branch,
                source_type: .result.source.type,
                source_repo: .result.source.config.repo_name,
                source_branch: .result.source.config.production_branch,
                build_command: .result.build_config.build_command,
                destination_dir: .result.build_config.destination_dir,
                domains: .result.domains}' inventory/api-response.json > "inventory/$name.json"
              ok=1
            fi
          done
          rm -f inventory/api-response.json
          if [ "$ok" -ne 1 ]; then
            echo "::warning::No detailed Pages configuration retrieved"
            exit 1
          fi
      - name: Inspect deployment branches (read only)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for project in yurulink-frontend; do
            status=$(curl --silent --show-error -o inventory/deployments-response.json -w '%{http_code}' \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$project/deployments?per_page=20")
            if [ "$status" != 200 ]; then
              echo "::warning::Deployment inventory for $project: HTTP $status"
              continue
            fi
            jq '[.result[] | {
              id, environment, url, created_on,
              branch: .deployment_trigger.metadata.branch,
              commit_hash: .deployment_trigger.metadata.commit_hash,
              latest_stage: (.stages[-1].status // null)
            }]' inventory/deployments-response.json > "inventory/$project-deployments.json"
            echo "$project: deployment inventory retrieved"
          done
          rm -f inventory/deployments-response.json
      - name: Verify updated API token and DNS access (read only)
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          hdr="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          verified=false
          for verifier in "user/tokens/verify" "accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify"; do
            status=$(curl -sS -o inventory/token-verification.json -w '%{http_code}' -H "$hdr" "$api/$verifier")
            if [[ "$status" == 200 ]] && jq -e '.success == true and .result.status == "active"' inventory/token-verification.json >/dev/null; then
              echo "Cloudflare token active (verified through $verifier)"
              verified=true
              break
            fi
            echo "Token verification endpoint $verifier returned HTTP $status; trying compatible endpoint"
          done
          if [[ "$verified" != true ]]; then
            echo "::warning::Token verification endpoint was unavailable; checking effective Pages and DNS API access directly"
          fi
          curl -fsS -H "$hdr" "$api/zones?name=yurulink.com&per_page=5" > inventory/zones-response.json
          zone=$(jq -er '.result[] | select(.name == "yurulink.com") | .id' inventory/zones-response.json | head -1)
          if [[ ! "$zone" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::yurulink.com zone is unavailable to updated token"
            exit 1
          fi
          echo "Cloudflare zone discovery: yurulink.com accessible"
          curl -fsS -H "$hdr" "$api/zones/$zone/dns_records?per_page=5" > inventory/dns-response.json
          jq -e '.success == true and (.result | type == "array")' inventory/dns-response.json >/dev/null
          jq '{zone: "yurulink.com", result_count: (.result | length), total_records: (.result_info.total_count // null), access: "DNS records read succeeded; write not executed"}' inventory/dns-response.json > inventory/dns-access.json
          echo "DNS records API: access verified without modifying any record"
          rm -f inventory/token-verification.json inventory/zones-response.json inventory/dns-response.json
      - name: Inspect old separate Staging Pages project (read only)
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          hdr="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS -H "$hdr" "$api/yurulink-frontend-staging" > inventory/old-response.json
          jq -e '.success == true and .result.name == "yurulink-frontend-staging"' inventory/old-response.json >/dev/null
          jq '{name: .result.name, subdomain: .result.subdomain, domains: .result.domains, source_repo: .result.source.config.repo_name, source_branch: .result.source.config.production_branch, project_id: .result.id}' inventory/old-response.json > inventory/old-project.json
          curl -fsS -H "$hdr" "$api/yurulink-frontend-staging/deployments?per_page=1" > inventory/old-deployments-response.json
          jq -e '.success == true' inventory/old-deployments-response.json >/dev/null
          jq '{total_deployments: (.result_info.total_count // null), page_count: (.result_info.total_pages // null), sampled: (.result | length)}' inventory/old-deployments-response.json > inventory/old-deployments-summary.json
          echo "Old separate Pages project located; deployment summary attached"
          jq -c '{name,subdomain,domains,source_repo,source_branch}' inventory/old-project.json
          jq -c '.' inventory/old-deployments-summary.json
          rm -f inventory/old-response.json inventory/old-deployments-response.json
      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-inventory-request
          path: |
            inventory/projects-summary.txt
            inventory/projects-details.json
            inventory/production-project.json
            inventory/yurulink-frontend-deployments.json
            inventory/dns-access.json
            inventory/old-project.json
            inventory/old-deployments-summary.json
          retention-days: 7
          if-no-files-found: error
      - name: Validate Discord event routes
        run: node ops/notifications/validate-routes.js
      - name: Notify Discord (optional)
        if: always()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          YURULINK_EVENT_CODE: ops.cloudflare.inventory.completed
          YURULINK_EVENT_STATUS: ${{ job.status }}
        run: node ops/notifications/notify-discord.js
