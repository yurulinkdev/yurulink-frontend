name: Cloudflare inventory request (read only)

on:
  push:
    branches: [main]
    paths:
      - ops/requests/cloudflare-inventory.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-inventory-request
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate inventory request
        shell: bash
        run: |
          set -euo pipefail
          file=ops/requests/cloudflare-inventory.json
          jq -e '
            type == "object" and
            (keys | sort) == ["action","request_id","schema_version"] and
            .schema_version == 1 and
            .action == "inventory_pages_readonly" and
            (.request_id | type == "string" and test("^[a-zA-Z0-9_-]{1,64}$"))
          ' "$file" >/dev/null
          echo "Validated read-only inventory request"
      - name: Check Cloudflare configuration
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing variable CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler
        run: npm install --no-save --no-audit --no-fund wrangler@4
      - name: List Pages projects with Wrangler
        run: npx wrangler pages project list
      - name: Retrieve sanitized Pages configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inventory
          curl --fail --silent --show-error --retry 2 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects?per_page=100" \
            > inventory/raw.json
          jq -e '.success == true' inventory/raw.json >/dev/null
          jq '[.result[] | {
            name, subdomain, production_branch,
            source_type: .source.type,
            source_repo: .source.config.repo_name,
            build_command: .build_config.build_command,
            destination_dir: .build_config.destination_dir,
            domains
          }]' inventory/raw.json > inventory/projects-summary.json
          rm inventory/raw.json
          jq . inventory/projects-summary.json
      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-inventory-request
          path: inventory/projects-summary.json
          retention-days: 7
          if-no-files-found: error
