name: Retire legacy standalone Cloudflare Pages Staging (explicit request)

on:
  push:
    branches: [main]
    paths:
      - ops/requests/cloudflare-retire-staging.json

permissions:
  contents: read

concurrency:
  group: yurulink-cloudflare-retire-old-staging
  cancel-in-progress: false

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CONFIRM_LEGACY_PROJECT: yurulink-frontend-staging
    steps:
      - name: Checkout read-only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate exact authorized destructive request
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            type == "object" and
            (keys | sort) == ["action","confirm","project","request_id","schema_version"] and
            .schema_version == 1 and
            .action == "retire_old_pages_project" and
            .project == "yurulink-frontend-staging" and
            .confirm == "DELETE_yurulink-frontend-staging" and
            (.request_id | type == "string" and test("^[a-zA-Z0-9_-]{1,64}$"))
          ' ops/requests/cloudflare-retire-staging.json >/dev/null
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "Validated exact legacy project request: yurulink-frontend-staging"
      - name: Remove excessive historical deployments and delete ONLY old Pages project
        run: python3 scripts/cloudflare-legacy-cleanup.py
      - name: Save sanitized deletion report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-legacy-staging-retirement
          path: maintenance-report/
          retention-days: 30
          if-no-files-found: warn
