name: Compare legacy and preview staging

on:
  push:
    branches: [staging]
    paths:
      - scripts/compare-staging.mjs
      - .github/workflows/compare-staging.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --no-audit --no-fund @playwright/test
          npx playwright install --with-deps chromium
      - name: Compare live staging pages
        run: node scripts/compare-staging.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-comparison
          path: |
            comparison-report.json
            comparison-legacy.png
            comparison-preview.png
          if-no-files-found: warn
