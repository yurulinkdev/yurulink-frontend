baseURL = "https://staging.yurulink-frontend.pages.dev/"
# staging専用。main昇格時はProductionのURLへ差し替える。
title = "YuruLink"
defaultContentLanguage = "ja"
disableKinds = ["taxonomy", "term", "RSS"]
enableRobotsTXT = true

[params]
# 採用JPEGを輪郭抽出・単色化した共通ベクターSVGを使用する。
brand_logo = "brand/yurulink-symbol-master.svg"
# サイドバーの注記。空欄は表示しない。審査ポリシーそのものは変更しない。
sidebar_notice = ""
# OGPは候補AをPreviewで暫定設定。正式採用の判断後に切り替える。
og_image = "ogp/yurulink-light.png"

# ナビゲーションの表示名はここで変更する。
[params.navigation]
posts_label = "記事"

# 本番アカウントのURLは確認後に登録。未設定のリンクは表示しない。
[params.social]
x = ""
instagram = ""
youtube = ""
bluesky = ""
threads = ""
discord = ""

# GA4測定ID（G-...）。空なら測定機能を読み込まない。計測は訪問者の同意後。
[params.analytics]
ga4_measurement_id = ""
